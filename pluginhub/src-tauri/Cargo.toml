[package]
name = "pluginhub"
version = "1.4.0"
description = "插件中心：统一管理 Claude Code 和 Codex 的插件"
edition = "2021"
rust-version = "1.90.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # 改 settings.json 时保持原来的键顺序
chrono = "0.4"
regex = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
# 自我更新：从 GitHub Release 下载新版本装上，装完重启
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
# 搜 skills.sh 上的技能（registry.rs）
# 搜 skills.sh 上的技能（registry.rs）
ureq = "3"

# 只在对应的系统上编译的依赖；用到它们的代码都在 src/platform/ 里
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging", # ShellExecuteW 的签名用到它，以前靠别的依赖顺带打开，tauri 2.12 之后要自己写
    "Win32_Globalization",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
