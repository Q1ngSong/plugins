<svg xmlns="http://www.w3.org/2000/svg" width="840" height="424" viewBox="0 0 840 424" role="img" aria-labelledby="title desc">
<title id="title">真实检查：问 app 本人</title>
<desc id="desc">Claude Code 这边跑 claude plugin list 和 plugin details，逐个核对 skill；Codex 这边跑 codex plugin list，再渲染真正交给模型的提示，确认每个 skill 都在、文件都在 ~/.yuwanplugins 里。</desc>
<style>svg{--bg:#faf8f5;--blue:#3b82f6;--cc:#c2552f;--cx:#0b8a6a;--edge:#e7e3dc;--ink:#18181b;--ink2:#52525b;--ink3:#a1a1aa;--line:#e4e4e7;--oktag:#d1fae5;--oktx:#047857;--panel:#ffffff;--sunk:#f4f4f5;--term:#1f1f1f;--termdim:#8b8b8b;--termhi:#ffffff}@media (prefers-color-scheme:dark){svg{--bg:#18181a;--cc:#f0936c;--cx:#4fd1a8;--edge:#2e2e33;--ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:#3b3b41;--oktag:#0f2e24;--oktx:#6ee7b7;--panel:#232326;--sunk:#2d2d31;--term:#141414}}text{font-family:'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC',sans-serif;font-size:13px;fill:var(--ink)}.m{font-family:Consolas,'SFMono-Regular',Menlo,'Cascadia Mono','Microsoft YaHei','PingFang SC',monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}.b{font-weight:600}.ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nf{fill:none}.g-mg0{stop-color:var(--blue);stop-opacity:.09}.g-mg1{stop-color:var(--blue);stop-opacity:0}.g-fd0{stop-color:var(--panel);stop-opacity:0}.g-fd1{stop-color:var(--panel);stop-opacity:1}.f-bg{fill:var(--bg)}.f-cc{fill:var(--cc)}.f-cx{fill:var(--cx)}.f-ink2{fill:var(--ink2)}.f-ink3{fill:var(--ink3)}.f-oktag{fill:var(--oktag)}.f-oktx{fill:var(--oktx)}.f-panel{fill:var(--panel)}.f-sunk{fill:var(--sunk)}.f-term{fill:var(--term)}.f-termdim{fill:var(--termdim)}.f-termhi{fill:var(--termhi)}.s-edge{stroke:var(--edge)}.s-line{stroke:var(--line)}.s-oktx{stroke:var(--oktx)}</style>
