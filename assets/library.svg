<svg xmlns="http://www.w3.org/2000/svg" width="840" height="356" viewBox="0 0 840 356" role="img" aria-labelledby="title desc">
<title id="title">常驻和按需</title>
<desc id="desc">常驻的插件每次会话都把 13 个技能的说明放进模型提示，约 2,300 token。改成按需后，提示里只剩技能库的一句说明，约 220 token；用到时模型再顺着技能库的目录读到那个技能的 SKILL.md。</desc>
<style>svg{--ambox:#fef6e8;--amink:#78350f;--bg:#faf8f5;--blue:#3b82f6;--bluebg:#eff6ff;--blueln:#bfdbfe;--edge:#e7e3dc;--ink:#18181b;--ink2:#52525b;--ink3:#a1a1aa;--line:#e4e4e7;--oktag:#d1fae5;--oktx:#047857;--panel:#ffffff;--sunk:#f4f4f5}@media (prefers-color-scheme:dark){svg{--ambox:#2b2415;--amink:#fde68a;--bg:#18181a;--bluebg:#1a2540;--blueln:#1e3a8a;--edge:#2e2e33;--ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:#3b3b41;--oktag:#0f2e24;--oktx:#6ee7b7;--panel:#232326;--sunk:#2d2d31}}text{font-family:'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC',sans-serif;font-size:13px;fill:var(--ink)}.m{font-family:Consolas,'SFMono-Regular',Menlo,'Cascadia Mono','Microsoft YaHei','PingFang SC',monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}.b{font-weight:600}.ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nf{fill:none}.g-mg0{stop-color:var(--blue);stop-opacity:.09}.g-mg1{stop-color:var(--blue);stop-opacity:0}.g-fd0{stop-color:var(--panel);stop-opacity:0}.g-fd1{stop-color:var(--panel);stop-opacity:1}.f-ambox{fill:var(--ambox)}.f-amink{fill:var(--amink)}.f-bg{fill:var(--bg)}.f-blue{fill:var(--blue)}.f-bluebg{fill:var(--bluebg)}.f-ink2{fill:var(--ink2)}.f-ink3{fill:var(--ink3)}.f-oktag{fill:var(--oktag)}.f-oktx{fill:var(--oktx)}.f-panel{fill:var(--panel)}.f-sunk{fill:var(--sunk)}.s-blue{stroke:var(--blue)}.s-blueln{stroke:var(--blueln)}.s-edge{stroke:var(--edge)}.s-ink3{stroke:var(--ink3)}.s-line{stroke:var(--line)}</style>
<rect x="0.5" y="0.5" width="839" height="355" rx="16" class="f-bg s-edge"/>
<rect x="24" y="24" width="380" height="262" rx="12" class="f-panel s-line"/>
<rect x="436" y="24" width="380" height="262" rx="12" class="f-panel s-line"/>
<line x1="410" y1="150" x2="424" y2="150" class="s-ink3" stroke-width="1.5"/><path d="M430 150L423 153.5L423 146.5Z" class="f-ink3"/>
<text x="44" y="56" class="b" style="font-size:15px">常驻</text>
<text x="80" y="56" class="f-ink3" style="font-size:12px">每次会话都带着全部说明</text>
<rect x="44" y="72" width="340" height="150" rx="8" class="f-sunk"/>
<text x="56" y="92" class="f-ink3" style="font-size:11px">模型提示里的技能清单</text>
<text x="56" y="114" class="f-ink2 m" style="font-size:10.5px" xml:space="preserve">- auditing-code-comments: Use after a feature…</text>
<text x="56" y="132" class="f-ink2 m" style="font-size:10.5px" xml:space="preserve">- comparing-methods-fairly: Use when an exper…</text>
<text x="56" y="150" class="f-ink2 m" style="font-size:10.5px" xml:space="preserve">- dclh: DCLH / dclh：design-code-like-a-human…</text>
<text x="56" y="168" class="f-ink2 m" style="font-size:10.5px" xml:space="preserve">- designing-project-layout: Use when a resea…</text>
<text x="56" y="186" class="f-ink2 m" style="font-size:10.5px" xml:space="preserve">- evaluating-frozen-methods: Use when the me…</text>
<text x="56" y="208" class="f-ink3 m" style="font-size:10.5px" xml:space="preserve">  …… 一共 13 条</text>
<rect x="44" y="236" width="340" height="34" rx="8" class="f-ambox"/>
<text x="58" y="258" class="f-amink b" style="font-size:12.5px">每次会话约 2,300 token，用不用得上都要读</text>
<text x="456" y="56" class="b" style="font-size:15px">按需</text>
<text x="492" y="56" class="f-ink3" style="font-size:12px">只带技能库的一句说明</text>
<rect x="456" y="72" width="340" height="58" rx="8" class="f-sunk"/>
<text x="468" y="92" class="f-ink3" style="font-size:11px">模型提示里的技能清单</text>
<text x="468" y="114" class="m" style="font-size:10.5px" xml:space="preserve">- skill-library: Index of 13 installed skil…</text>
<text x="456" y="150" class="f-ink3" style="font-size:11px">模型用到时顺着读下去：</text>
<rect x="456" y="160" width="104" height="58" rx="8" class="f-bluebg s-blueln"/>
<text x="466" y="184" class="m b" style="font-size:10.5px">SKILL.md</text>
<text x="466" y="204" class="f-ink2" style="font-size:11px">按插件分组</text>
<line x1="562" y1="189" x2="568" y2="189" class="s-blue" stroke-width="1.5"/><path d="M572 189L567 191.5L567 186.5Z" class="f-blue"/>
<rect x="574" y="160" width="104" height="58" rx="8" class="f-bluebg s-blueln"/>
<text x="584" y="184" class="m b" style="font-size:10.5px">groups/&lt;组&gt;.md</text>
<text x="584" y="204" class="f-ink2" style="font-size:11px">说明和位置</text>
<line x1="680" y1="189" x2="686" y2="189" class="s-blue" stroke-width="1.5"/><path d="M690 189L685 191.5L685 186.5Z" class="f-blue"/>
<rect x="692" y="160" width="104" height="58" rx="8" class="f-bluebg s-blueln"/>
<text x="702" y="184" class="b" style="font-size:10.5px">那个技能的</text>
<text x="702" y="204" class="f-ink2 m" style="font-size:11px">SKILL.md</text>
<rect x="456" y="236" width="340" height="34" rx="8" class="f-oktag"/>
<text x="470" y="258" class="f-oktx b" style="font-size:12.5px">每次会话约 220 token，其余用到时再读</text>
<text x="24" y="314" class="f-ink2" style="font-size:12.5px">改成按需：插件中心从两边卸下它，文件原样留在 ~/.yuwanplugins，只在技能库里记一笔；改回常驻就装回去。</text>
<text x="24" y="336" class="f-ink2" style="font-size:12.5px">只有技能能按需读。钩子、斜杠命令、子代理和 MCP 服务要装在 app 里才会生效，详情页会标出来。</text>
</svg>
