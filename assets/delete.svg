<svg xmlns="http://www.w3.org/2000/svg" width="840" height="292" viewBox="0 0 840 292" role="img" aria-labelledby="title desc">
<title id="title">两个删除按钮</title>
<desc id="desc">首页卡片上的删除从所有 app 删掉插件；详情页里 app 卡片上的删除只动那一个 app。不再管理的插件，文件夹挪进 ~/.pluginhub/backups。</desc>
<style>svg{--bg:#faf8f5;--blue:#3b82f6;--bluebg:#eff6ff;--blueln:#bfdbfe;--cc:#c2552f;--ccbg:#fbe9e1;--ccln:#f0c4b2;--cx:#0b8a6a;--cxbg:#dff4ec;--cxln:#aee0cd;--edge:#e7e3dc;--ink:#18181b;--ink2:#52525b;--ink3:#a1a1aa;--line:#e4e4e7;--oktag:#d1fae5;--oktx:#047857;--panel:#ffffff;--rdtag:#fee2e2;--rdtx:#dc2626}@media (prefers-color-scheme:dark){svg{--bg:#18181a;--bluebg:#1a2540;--blueln:#1e3a8a;--cc:#f0936c;--ccbg:#2e1a12;--ccln:#5a3322;--cx:#4fd1a8;--cxbg:#0f2720;--cxln:#1f4b3d;--edge:#2e2e33;--ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#71717a;--line:#3b3b41;--oktag:#0f2e24;--oktx:#6ee7b7;--panel:#232326;--rdtag:#3f1d1d;--rdtx:#fca5a5}}text{font-family:'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC',sans-serif;font-size:13px;fill:var(--ink)}.m{font-family:Consolas,'SFMono-Regular',Menlo,'Cascadia Mono','Microsoft YaHei','PingFang SC',monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}.b{font-weight:600}.ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nf{fill:none}.g-mg0{stop-color:var(--blue);stop-opacity:.09}.g-mg1{stop-color:var(--blue);stop-opacity:0}.g-fd0{stop-color:var(--panel);stop-opacity:0}.g-fd1{stop-color:var(--panel);stop-opacity:1}.f-bg{fill:var(--bg)}.f-bluebg{fill:var(--bluebg)}.f-cc{fill:var(--cc)}.f-ccbg{fill:var(--ccbg)}.f-cx{fill:var(--cx)}.f-cxbg{fill:var(--cxbg)}.f-ink2{fill:var(--ink2)}.f-ink3{fill:var(--ink3)}.f-oktag{fill:var(--oktag)}.f-oktx{fill:var(--oktx)}.f-panel{fill:var(--panel)}.f-rdtag{fill:var(--rdtag)}.s-blue{stroke:var(--blue)}.s-blueln{stroke:var(--blueln)}.s-ccln{stroke:var(--ccln)}.s-cxln{stroke:var(--cxln)}.s-edge{stroke:var(--edge)}.s-ink2{stroke:var(--ink2)}.s-ink3{stroke:var(--ink3)}.s-line{stroke:var(--line)}.s-rdtx{stroke:var(--rdtx)}</style>
<defs><clipPath id="c1"><rect x="452" y="86" width="196" height="134" rx="12"/></clipPath></defs>
